# Bei PRs: Typecheck + Selbsttest + Docker-Build. Auf main danach zusätzlich per SSH ausrollen.
# Benötigte Repository-Secrets für Deploy auf main:
#   DEPLOY_HOST      IP oder Hostname des Servers
#   DEPLOY_USER      z.B. deploy
#   DEPLOY_SSH_KEY   privater SSH-Key (ed25519), dessen Public-Key in ~deploy/.ssh/authorized_keys liegt
name: deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Docker-Build (Smoke)
        run: docker build -t czarina-video-worker:ci .

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: SSH-Key einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Ausrollen
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash /opt/czarina-video-worker/deploy/deploy.sh'
